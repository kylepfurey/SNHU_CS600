# Application Name
spring.application.name=salesguru

## Server connection properties
server.address=127.0.0.1

## Unencrypted Port
## server.port=8080

## Encrypted Port - Using 8443 (untrusted port range)
## The use of TLS encryption enabled in the following 
## lines validates requirement #5 - "The application shall
## provide a mechanism to encrypt data in transit".
server.port=8443

## Cerrtificate Information - keystore must live parallel to pom.xml
server.ssl.key-store = keystore.p12
server.ssl.key-store-password = cs600
server.ssl.key-store-type = PKCS12
server.ssl.key-alias = cs600dev

## Default connection pool for spring JPA defaults
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

## PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/SalesGuru
spring.datasource.username=cs600
spring.datasource.password=cs600