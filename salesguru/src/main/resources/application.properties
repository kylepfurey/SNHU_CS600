# .properties
# Application Configuration
# by Kyle Furey

# Credentials are not stored in the project. For testing,
# you can run RunSalesGuru.sh in the salesguru/init folder.

# Application Name
spring.application.name=salesguruplus

# Server Connection
server.address=127.0.0.1
server.port=8443

# Certificate Information
server.ssl.key-store=${SALESGURU_KEYSTORE_PATH}
server.ssl.key-store-password=${SALESGURU_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=cs600dev

# Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# PostgreSQL
spring.datasource.url=${SALESGURU_DB_URL}
spring.datasource.username=${SALESGURU_DB_USER}
spring.datasource.password=${SALESGURU_DB_PASSWORD}

# Auth Database
salesguru.auth.datasource.url=${SALESGURU_AUTH_DB_URL}
salesguru.auth.datasource.username=${SALESGURU_AUTH_DB_USER}
salesguru.auth.datasource.password=${SALESGURU_AUTH_DB_PASSWORD}
salesguru.auth.datasource.hikari.connection-timeout=5000
salesguru.auth.datasource.hikari.maximum-pool-size=3

# Validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
