## .properties
## Application Configuration
## by Kyle Furey

## Application Name
spring.application.name=module3

## Server connection properties
server.address=127.0.0.1
server.port=8080

## Certificate
server.ssl.enabled=true
server.ssl.key-store=keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=cs600
server.ssl.key-alias=cs600dev

## Note: keystore.p12 should be kept securely outside the repository, but to ensure proper
##       functionality for grading, I have inlined the path to the keystore and its password.

## Authentication
app.security.username=cs600
app.security.password=cs600

## Note: Same as above. In production, we don't encode user credentials in plaintext files.
